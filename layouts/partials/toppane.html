<!-- Top Pane (Navbar?) -->

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3670265121770956"
crossorigin="anonymous"></script>

<div class="toppanel">
	<div class="tp-left">
		<a href="{{ site.Home.RelPermalink }}">
			<img class="tp-banner" src="{{ "/img/banner.webp" | relURL }}" width="100%" />
		</a>
	</div>
	<input type="checkbox" id="burger-toggle" class="burger-checkbox">
	<label for="burger-toggle" class="burger-menu">
		<span></span>
		<span></span>
		<span></span>
	</label>
	<div class="tp-right" id="mobile-menu">
		<ul class="tp-nav">
			<li><a href="{{ site.Home.RelPermalink }}">{{ i18n "home" }}</a></li>
			<li><a href="{{ "/about/about" | relLangURL }}">{{ i18n "about" }}</a></li>
			<li class="tp-dropdown">
				<input type="checkbox" id="social-toggle" class="dropdown-checkbox">
				<label for="social-toggle">{{ i18n "social" }}</label>
				<ul class="tp-dropdown-elements">
					{{ range .Site.Params.social_links }}
					<li>
						<a href="{{ .url }}" target="_blank" aria-label="{{ .name }}">
							{{ .name }}
						</a>
					</li>
					{{ end }}
				</ul>
			</li>
			<li><a href="{{ "/feed.xml" | absLangURL }}">{{ i18n "rss" }}</a></li>

			{{ if .IsTranslated }}
			<li class="tp-dropdown">
				<input type="checkbox" id="lang-toggle" class="dropdown-checkbox">
				<label for="lang-toggle">{{ .Language.Label }}</label>
				<ul class="lang-switch tp-dropdown-elements">
					{{ range .AllTranslations }}
					<li>
						<a href="{{ .RelPermalink }}" hreflang="{{ .Language.Lang }}">
							{{ .Language.Label }}
						</a>
					</li>
					{{ end }}
				</ul>
			</li>
			{{ end }}
		</ul>
	</div>
</div>
